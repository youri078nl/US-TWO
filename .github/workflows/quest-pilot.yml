name: Quest offline pilot tests
on:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'quest-board.css'
      - 'quest-board.js'
      - 'quest-cinematics.js'
      - 'quest-poses.js'
      - 'quest-3d.js'
      - 'tests/quest-browser-3d.cjs'
      - 'tests/quest-browser-pose-frames.cjs'
      - 'tests/quest-browser-cinematics.cjs'
      - 'quest-pilot.js'
      - 'quest-catalog.js'
      - 'tests/quest-browser-smoke.cjs'
      - 'tests/quest-browser-offline.cjs'
      - 'tests/quest-browser-superdate.cjs'
      - 'tests/quest-browser-schedule.cjs'
      - 'tests/quest-browser-month-calendar.cjs'
      - 'tests/quest-budget-catalog.test.cjs'
      - 'supabase/migrations/20261116_premium_catalog_36.sql'
      - 'supabase/migrations/20261116_complete_240_catalog.sql'
      - 'supabase/catalog/*.json'
      - 'supabase/migrations/20261116_superdate_templates_18.sql'
      - 'tests/quest-superdate-content.test.cjs'
      - 'us-two-offline.js'
      - 'index.html'
      - 'service-worker.js'
      - 'tests/quest-pilot.test.cjs'
      - '.github/workflows/quest-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check app.js
          node --check quest-board.js
          node --check quest-cinematics.js
          node --check quest-poses.js
          node --check quest-3d.js
          node --check quest-pilot.js
          node --check quest-catalog.js
          node --check us-two-offline.js
          node --check service-worker.js
      - name: Install isolated browser-storage test dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.5
      - name: Exercise offline browser integration
        run: node tests/quest-pilot.test.cjs
      - name: Validate authored budget catalog and shared-cost filtering
        run: node tests/quest-budget-catalog.test.cjs
      - name: Verify eighteen private superdate storylines
        run: node tests/quest-superdate-content.test.cjs
      - name: Reuse downloaded Playwright Chromium across CI runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-1.56.1
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual Chromium interface smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/us-two-http.log 2>&1 &
          sleep 2
          node tests/quest-browser-smoke.cjs
      - name: Check on-board animation safety in Chromium
        run: node tests/quest-browser-cinematics.cjs
      - name: Verify offline-approved frame packs, scene playback and account separation
        run: node tests/quest-browser-pose-frames.cjs
      - name: Verify original WebGL2 renderer safety and paired-account gating
        run: node tests/quest-browser-3d.cjs
      - name: Test durable offline replay in two real Chromium tabs
        run: node tests/quest-browser-offline.cjs
      - name: Verify two-browser superdate consent and private preparation
        run: node tests/quest-browser-superdate.cjs
      - name: Verify two-browser shared date planning and partner acceptance
        run: node tests/quest-browser-schedule.cjs
      - name: Verify canonical game dates in the existing month calendar
        run: node tests/quest-browser-month-calendar.cjs
