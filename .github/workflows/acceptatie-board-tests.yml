name: US TWO acceptatie bordtests
on:
  push:
    paths:
      - 'acceptatie/quest-board-interactions.js'
      - 'acceptatie/tests/board-pointer.test.cjs'
      - '.github/workflows/acceptatie-board-tests.yml'
  pull_request:
    paths:
      - 'acceptatie/quest-board-interactions.js'
      - 'acceptatie/tests/board-pointer.test.cjs'
      - '.github/workflows/acceptatie-board-tests.yml'
  workflow_dispatch:
jobs:
  board-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check acceptatie/quest-board.js
          node --check acceptatie/quest-board-interactions.js
          node --check acceptatie/quest-date-browser.js
      - name: Pointer regression tests
        run: node --test acceptatie/tests/board-pointer.test.cjs
